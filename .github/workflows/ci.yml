name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: go test
        run: go test -race ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t greaderd:ci .

      - name: Health check
        run: |
          docker run -d --name greaderd -e GREADERD_USER=ci -e GREADERD_PASSWORD=ci greaderd:ci
          for _ in $(seq 1 20); do
            if docker exec greaderd /greaderd healthcheck; then
              exit 0
            fi
            sleep 1
          done
          docker logs greaderd
          exit 1
